<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | NoteSwap Campus</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            📚
        </div>


        <h1>
            Welcome Back!
        </h1>


        <p class="auth-subtitle">
            Login to NoteSwap Campus.
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form
            action="/login"
            method="POST"
        >

            <div class="form-group">

                <label>
                    College Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Login →
            </button>

        </form>


        <p class="auth-switch">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </p>

    </div>

</div>

</body>

</html>
